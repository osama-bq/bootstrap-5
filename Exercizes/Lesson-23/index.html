<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
</head>
<body>
    <div class="container mt-3">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <form>
                    <div class="mb-3">
                        <label class="form-label" for="u_name">Username</label>
                        <input class="form-control" type="text" id="u_name">
                    </div>
                    <div class="mb-3">
                        <label class="form-label" for="u_text">Some Text</label>
                        <input class="form-control form-control-lg" type="text" id="u_text">
                    </div>
                    <div class="mb-3">
                        <label class="form-label" for="u_text1">Some Text</label>
                        <input class="form-control form-control-sm" type="text" id="u_text1">
                    </div>
                    <div class="mb-3">
                        <label class="form-label" for="u_email">Email</label>
                        <input disabled value="johndoe@gmail.com" class="form-control" type="email" id="u_email">
                    </div>
                    <div class="mb-3">
                        <label class="form-label" for="u_file">File</label>
                        <input class="form-control" type="file" id="u_file">
                    </div>
                    <div class="mb-3">
                        <label class="form-label" for="u_color">Color</label>
                        <input class="form-control form-control-color" type="color" id="u_color">
                    </div>
                    <div class="mb-3">
                        <label class="form-label" for="u_comment">Comment</label>
                        <textarea class="form-control" rows="5" id="u_comment"></textarea>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
