<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
</head>
<body>
    <div class="container mt-3">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="d-grid gap-2">
                    <button class="btn btn-primary" type="button">Button</button>
                    <button class="btn btn-secondary" type="button">Button</button>
                </div>
            </div>
        </div>
        <div class="row justify-content-center mt-3">
            <div class="col-md-8">
                <div class="d-grid gap-2 d-md-block">
                    <button class="btn btn-primary" type="button">Button</button>
                    <button class="btn btn-secondary" type="button">Button</button>
                </div>
            </div>
        </div>
        <div class="row justify-content-center mt-3">
            <div class="col-md-8">
                <button class="btn btn-primary" type="button" data-bs-toggle="button">Toggle Button</button>
                <button class="btn btn-primary active" type="button" data-bs-toggle="button" aria-pressed="true">Toggle Button</button>
                <button class="btn btn-primary" type="button" data-bs-toggle="button" disabled>Toggle Button</button>
            </div>
        </div>
        <div class="row justify-content-center mt-3">
            <div class="col-md-8">
                <a class="btn btn-success" data-bs-toggle="button" href="#" role="button" aria-pressed="false">Toggle Link</a>
                <a class="btn btn-success active" data-bs-toggle="button" href="#" role="button" aria-pressed="true">Toggle Link</a>
                <a class="btn btn-success disabled" data-bs-toggle="button" href="#" role="button" aria-disabled="true">Toggle Link</a>
            </div>
        </div>
        <div class="row justify-content-center mt-3">
            <div class="col-md-8">
                <button type="button" class="btn" style="
                    --bs-btn-color: white;
                    --bs-btn-bg: crimson;
                    --bs-btn-border-color: orangered;
                    --bs-btn-hover-color: white;
                    --bs-btn-hover-bg: black;
                    --bs-btn-hover-border-color: crimson;
                    ">Different Color</button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
